name: TaskManager API

on:
  push:
    branches: [main]
    paths: ['WebAPI/**', '.github/workflows/api.yml']
  pull_request:
    branches: [main]
    paths: ['WebAPI/**', '.github/workflows/api.yml']

# Only ever reads the repository.
permissions:
  contents: read

jobs:
  # Exercises the real service against a real PostgreSQL — not mocks, and not a
  # different database provider that would hide provider-specific behaviour.
  # This is what makes "it works" a checkable claim rather than a README
  # assertion: every push re-proves the endpoint contract.
  contract:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: todo_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: WebAPI/TaskManagerAPI
        run: dotnet build --configuration Release

      - name: Start the API
        working-directory: WebAPI/TaskManagerAPI
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=todo_db;Username=postgres;Password=ci-only-not-a-secret
          ASPNETCORE_URLS: http://localhost:5095
          ASPNETCORE_ENVIRONMENT: Development
          ApiKey: ci-only-not-a-secret
        run: |
          dotnet run --configuration Release --no-build > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5095/health >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat api.log; exit 1

      # Asserts the status code of every verb, including the failure paths.
      # Those are the ones that rot silently — a 500 where a 404 belongs still
      # "works" until someone looks.
      - name: Endpoint contract
        run: |
          set -euo pipefail
          T=http://localhost:5095/api/todo
          K='X-Api-Key: ci-only-not-a-secret'
          fail=0
          check() { # name expected actual
            if [ "$2" = "$3" ]; then echo "  ok   $1 -> $3"
            else echo "  FAIL $1 -> expected $2, got $3"; fail=1; fi
          }
          code() { curl -sS -o /tmp/b.json -w '%{http_code}' "$@"; }

          check "POST valid"      201 "$(code -X POST -H "$K" $T -H 'Content-Type: application/json' -d '{"title":"ci","isCompleted":false}')"
          ID=$(sed -n 's/.*"id":\([0-9]*\).*/\1/p' /tmp/b.json)

          # Writes must be refused without a valid key; reads stay public.
          check "POST no key"     401 "$(code -X POST $T -H 'Content-Type: application/json' -d '{"title":"nokey"}')"
          check "POST wrong key"  401 "$(code -X POST $T -H 'X-Api-Key: wrong' -H 'Content-Type: application/json' -d '{"title":"badkey"}')"
          check "PUT no key"      401 "$(code -X PUT $T/$ID -H 'Content-Type: application/json' -d '{"title":"x","isCompleted":true}')"
          check "DELETE no key"   401 "$(code -X DELETE $T/$ID)"

          check "POST empty"      400 "$(code -X POST -H "$K" $T -H 'Content-Type: application/json' -d '{"title":""}')"
          check "GET all"         200 "$(code $T)"
          check "GET one"         200 "$(code $T/$ID)"
          check "GET missing"     404 "$(code $T/999999)"
          check "PUT"             204 "$(code -X PUT -H "$K" $T/$ID -H 'Content-Type: application/json' -d '{"title":"updated","isCompleted":true}')"
          check "PUT missing"     404 "$(code -X PUT -H "$K" $T/999999 -H 'Content-Type: application/json' -d '{"title":"x","isCompleted":true}')"
          check "DELETE"          204 "$(code -X DELETE -H "$K" $T/$ID)"
          check "DELETE again"    404 "$(code -X DELETE -H "$K" $T/$ID)"
          check "openapi"         200 "$(code http://localhost:5095/openapi/v1.json)"
          check "swagger ui"      200 "$(code http://localhost:5095/swagger/index.html)"

          # The server owns id and createdAt. A client that supplies them must
          # not be able to choose which row it writes.
          code -X POST -H "$K" $T -H 'Content-Type: application/json' \
            -d '{"id":424242,"title":"overpost","createdAt":"1990-01-01T00:00:00Z"}' >/dev/null
          GOT=$(sed -n 's/.*"id":\([0-9]*\).*/\1/p' /tmp/b.json)
          if [ "$GOT" = "424242" ]; then
            echo "  FAIL over-posting -> client set its own id"; fail=1
          else
            echo "  ok   over-posting -> server assigned id $GOT, client value ignored"
          fi
          if grep -q '1990-01-01' /tmp/b.json; then
            echo "  FAIL over-posting -> client set its own createdAt"; fail=1
          else
            echo "  ok   over-posting -> server assigned createdAt"
          fi

          exit $fail

      - name: API log on failure
        if: failure()
        working-directory: WebAPI/TaskManagerAPI
        run: cat api.log

  # Publishes the image the home server pulls. Runs only after the contract
  # tests pass, only for a push to main (never a pull request), and is the only
  # job with package-write access.
  publish:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<commit> is the immutable tag (use it to roll back); prod is the
      # moving tag the server's timer follows.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: WebAPI/TaskManagerAPI
          push: true
          tags: |
            ghcr.io/xenofongk/taskmanagerapi:sha-${{ github.sha }}
            ghcr.io/xenofongk/taskmanagerapi:prod
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
